    <script>
     function makeBurger(ingredient, count) {
        let burger = "";
        burger = burger + 'Булка ';
        console.log('Берём булочку');
        for(i=0; i<count; i++) {
            burger = burger + ' ' + ingredient + ' ';
            console.log('Кладём '+ (i+1) + ' ' + ingredient);
        }
        burger = burger + ' Булка';
        console.log('Берём булочку')
        return burger;
     }
     a = makeBurger('Сыр', 5);
     console.log(a);
